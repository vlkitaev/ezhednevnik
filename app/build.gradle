plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.vlad.diary'
    compileSdk 34

    defaultConfig {
        applicationId "ru.vlad.diary"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "4.2"
    }

    // Постоянный ключ подписи. Без него каждая сборка на GitHub подписывается
    // новым случайным ключом, и Android отказывается ставить обновление поверх.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
}
